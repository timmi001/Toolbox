services:
  - type: web
    name: video-downloader-backend
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: ALLOWED_ORIGINS
        value: https://toolbuxx.site,https://www.toolbuxx.site,https://toolboxx.site,https://www.toolboxx.site,https://toolbox-ashy-six.vercel.app
      - key: MAX_REQUEST_BODY_SIZE
        value: 10mb
      - key: COBALT_API_URL
        value: https://YOUR-COBALT-DOMAIN/
      - key: COBALT_API_KEY
        value: YOUR-COBALT-API-KEY
