<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Third-party ad script removed to prevent service-worker and asset interception -->

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <!-- Primary Meta ─────────────────────────────────────────────────── -->
    <title>ToolboXX — 200+ Free AI &amp; Utility Tools</title>
    <meta name="description" content="200+ free AI and utility tools for creators, students, developers and businesses. No sign-up. No tracking." />
    <meta name="robots" content="index, follow" />
    <meta name="impact-site-verification" value="5c7817dc-d1f2-47d0-bcfc-7cc91c37c09f" />

    <!-- Open Graph ───────────────────────────────────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://toolbuxx.site/" />
    <meta property="og:title" content="ToolboXX — 200+ Free AI &amp; Utility Tools" />
    <meta property="og:description" content="200+ free AI and utility tools for creators, students, developers and businesses. No sign-up. No tracking." />
    <meta property="og:image" content="https://toolbuxx.site/opengraph.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="ToolboXX" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card ─────────────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ToolboXX — 200+ Free AI &amp; Utility Tools" />
    <meta name="twitter:description" content="200+ free AI and utility tools for creators, students, developers and businesses. No sign-up. No tracking." />
    <meta name="twitter:image" content="https://toolbuxx.site/opengraph.jpg" />

    <!-- Favicon &amp; Icons ──────────────────────────────────────────── -->
    <!-- SVG favicon (modern browsers — sharp at any size) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- JPEG fallback for browsers that don't support SVG favicons -->
    <link rel="icon" type="image/jpeg" href="/logo.jpg" sizes="any" />
    <!-- iOS home-screen icon -->
    <link rel="apple-touch-icon" href="/logo.jpg" />
    <!-- PWA manifest -->
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Address-bar / tab colour on Android Chrome -->
    <meta name="theme-color" content="#4B0082" />

    <!-- Fonts ────────────────────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Structured Data — Organization + WebSite ─────────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "name": "ToolboXX",
          "url": "https://toolbuxx.site",
          "logo": {
            "@type": "ImageObject",
            "url": "https://toolbuxx.site/logo.jpg",
            "width": 180,
            "height": 180
          },
          "description": "200+ free AI and utility tools for creators, students, developers and businesses. No sign-up. No tracking.",
          "contactPoint": {
            "@type": "ContactPoint",
            "email": "hello@toolbuxx.app",
            "contactType": "customer support"
          }
        },
        {
          "@type": "WebSite",
          "name": "ToolboXX",
          "url": "https://toolbuxx.site",
          "description": "200+ free AI and utility tools for creators, students, developers and businesses. No sign-up. No tracking."
        }
      ]
    }
    </script>

    <!-- 3rd-party ad script removed -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
