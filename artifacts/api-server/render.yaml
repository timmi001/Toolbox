services:
  - type: web
    name: toolboxx-api
    runtime: docker
    # Docker context is the workspace root so pnpm can resolve lib/* packages
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: starter
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: AGENTROUTER_API_KEY
        sync: false   # primary AgentRouter API key; set manually in the Render dashboard
      - key: GEMINI_API_KEY
        sync: false   # set manually in Render dashboard
      - key: GOOGLE_API_KEY
        sync: false   # alias accepted by the Google SDK; keep in sync with the production secret if needed
      - key: GROQ_API_KEY
        sync: false   # optional fallback provider key
      - key: OPENROUTER_API_KEY
        sync: false   # optional fallback provider key
      - key: ALLOWED_ORIGINS
        value: https://toolboxx.site,https://www.toolboxx.site,https://toolbox-ashy-six.vercel.app
      - key: COBALT_API_URL
        sync: false
      - key: COBALT_API_KEY
        sync: false
      # Optional video timeout overrides (defaults are generous for most videos)
      # - key: VIDEO_INFO_TIMEOUT_MS
      #   value: "45000"
      # - key: VIDEO_STREAM_MAX_DURATION_MS
      #   value: "600000"
